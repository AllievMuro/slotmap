<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="slm-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>
    <filter id="slm-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#0F172A"/>

  <!-- Subtle grid slots hint in background -->
  <rect x="96" y="200" width="60" height="18" rx="4" fill="#F43F5E" opacity="0.08"/>
  <rect x="96" y="228" width="60" height="18" rx="4" fill="#F43F5E" opacity="0.08"/>
  <rect x="356" y="200" width="60" height="18" rx="4" fill="#F43F5E" opacity="0.08"/>
  <rect x="356" y="228" width="60" height="18" rx="4" fill="#F43F5E" opacity="0.08"/>

  <!-- Custom S letterform built from paths -->
  <g filter="url(#slm-glow)">
    <!-- S constructed from two arcs/curves forming a bold S shape -->
    <path d="
      M 310 148
      C 310 148 290 132 256 132
      C 206 132 172 158 172 196
      C 172 234 200 252 240 262
      L 268 270
      C 300 279 332 293 332 330
      C 332 368 300 382 256 382
      C 218 382 192 368 178 356
      L 162 344
    "
    fill="none"
    stroke="url(#slm-grad)"
    stroke-width="38"
    stroke-linecap="round"
    stroke-linejoin="round"
    />

    <!-- Top slot connector bar -->
    <rect x="196" y="131" width="88" height="34" rx="17" fill="url(#slm-grad)"/>

    <!-- Bottom slot connector bar -->
    <rect x="228" y="349" width="88" height="34" rx="17" fill="url(#slm-grad)"/>

    <!-- Pin dot top-right - schema pin symbol -->
    <circle cx="330" cy="165" r="14" fill="#FB7185"/>
    <circle cx="330" cy="165" r="7" fill="#0F172A"/>

    <!-- Pin dot bottom-left - schema pin symbol -->
    <circle cx="180" cy="349" r="14" fill="#FB7185"/>
    <circle cx="180" cy="349" r="7" fill="#0F172A"/>
  </g>
</svg>